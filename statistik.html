<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik - Kasir Angkringan</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .filter-card {
            margin-bottom: 20px;
            padding: 15px;
            background: #1f1f1f;
            border-radius: 10px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group label {
            font-weight: bold;
            color: #ff0000;
        }

        .filter-group input[type="date"] {
            background: #000;
            color: #ff0000;
            border: 1px solid #ff0000;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-filter {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-filter:hover, .btn-filter.active {
            background: #ff0000;
            color: #fff;
            border-color: #ff0000;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .history-card {
            background: #1f1f1f;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 4px solid #ff0000;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #444;
            padding-bottom: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #aaa;
        }

        .history-source {
            background: #333;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .history-source.kasir {
            background: #0056b3;
        }

        .history-source.rokok {
            background: #b35900;
        }

        .history-items {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .history-item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .history-footer {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 15px;
            color: #ff0000;
            border-top: 1px solid #333;
            padding-top: 8px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-reset {
            background: #8b0000;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-reset:hover {
            background: #ff0000;
        }
    </style>
</head>
<body>

<nav class="home-nav" style="display: block;">
    <button class="home-nav-btn" onclick="location.href='index.html'">⌂ Beranda</button>
</nav>

<section id="statisticsPage" class="app-page" style="display: block;">
    <header>
        <h1>ꦔ꧀ꦭꦢꦺꦤꦶ ꦏꦤ꧀ꦛꦶ ꦲꦠꦶ, ꦔꦸꦤ꧀ꦝꦸꦃ ꦫꦼꦗꦼꦏꦶ</h1>
        <p>JAWA JAWA JAWA JAWA JAWA JAWA</p>
    </header>

    <div class="container">
        <!-- FILTER TANGGAL -->
        <div class="card filter-card">
            <div class="filter-group">
                <label for="filterDate">📅 Filter Tanggal:</label>
                <input type="date" id="filterDate" onchange="onDateInputChange()">
                <button class="btn-filter" id="btnToday" onclick="filterToday()">Hari Ini</button>
                <button class="btn-filter" id="btnAll" onclick="filterAll()">Semua Tanggal</button>
            </div>
        </div>

        <!-- RINGKASAN STATISTIK -->
        <div class="stats-grid">
            <div class="card summary-box">
                <div class="summary-label">Total Pendapatan</div>
                <div class="summary-value" id="grandTotalIncome">Rp0</div>
            </div>
            <div class="card summary-box">
                <div class="summary-label">Total Transaksi</div>
                <div class="summary-value" id="totalTransactions">0</div>
            </div>
            <div class="card summary-box">
                <div class="summary-label">Pendapatan Kasir Utama</div>
                <div class="summary-value" id="kasirIncome">Rp0</div>
            </div>
            <div class="card summary-box">
                <div class="summary-label">Pendapatan Rokok</div>
                <div class="summary-value" id="rokokIncome">Rp0</div>
            </div>
        </div>

        <!-- RIWAYAT PESANAN -->
        <div class="card">
            <div class="action-bar">
                <h2 id="historyTitle">📑 Riwayat Transaksi</h2>
                <button class="btn-reset" onclick="clearAllHistory()">🗑️ Hapus Semua Riwayat</button>
            </div>

            <div id="historyList">
                <div class="empty">Belum ada riwayat transaksi.</div>
            </div>
        </div>
    </div>
</section>

<script src="statistik.js"></script>
</body>
</html>
